# ПРИМЕР. Файл можно импортировать с application.properties через
# spring.config.import=optional:file:./config/CONFIG_EXAMPLE.properties
# В production храните приватные значения отдельно (Docker secrets / configtree).
# Полный список доступных имен: service-common/docs/CONFIGURATION_RU.md

argent.config-validation.enabled=true
argent.config-validation.unknown-keys=warn
argent.config-validation.report-on-start=true

# Разрешённые лимиты. Запуск прекратится, если указать недопустимые значения.
argent.queue.max-concurrent-queues=4
argent.queue.poll-interval-ms=2000
argent.queue.heartbeat-interval-ms=15000
argent.queue.lease-seconds=60

argent.auth.session-ttl=30d
argent.auth.jwt.key-file=./config/argent-jwt.pem
argent.auth.registration.enabled=false
argent.security.cors.allowed-origins=http://localhost:4200

argent.attachments.root=./data/attachments
argent.attachments.max-size-bytes=20971520
argent.reports.max-rows=100000
argent.reports.query-timeout=60s
argent.transfer.import-on-error=fail-all

# Почта включается только при наличии реального SMTP.
argent.mail.enabled=false
# Если включить, понадобится задать argent.mail.from и spring.mail.host,
# а при spring.mail.properties.mail.smtp.auth=true — username и password.
# argent.mail.from=noreply@example.org
# spring.mail.host=smtp.example.org
# spring.mail.port=587
# spring.mail.properties.mail.smtp.starttls.enable=true
