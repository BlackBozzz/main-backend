# Профиль demo: ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
#
# =====================================================================
# ВНИМАНИЕ: ДЕМО-РЕЖИМ. Вход только по логину, без пароля.
# Любой, кто может достучаться до бэкенда, войдёт под любым пользователем,
# включая admin. Не включайте этот профиль в реальном развёртывании,
# не разобравшись в последствиях.
# =====================================================================
argent.auth.password-required=false
# Логин администратора, создаваемого при запуске (пароль в этом режиме не нужен)
argent.auth.bootstrap-admin.login=admin
