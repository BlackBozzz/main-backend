spring.application.name=main-backend

# ??????????? ? PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/main_backend?currentSchema=test
spring.datasource.username=postgres
spring.datasource.password=postgres

# ????????? ????????????? JPA-?????? ?? ????????? ?????????????? ??????
spring.jpa.open-in-view=false

# ????????? Hibernate ????????????? ????????? ? ???????? ???????
spring.jpa.hibernate.ddl-auto=none
# ????? ?? ????????? ??? JPA-?????????
spring.jpa.properties.hibernate.default_schema=test

# ???????? ?????????? ? ????????? ??????????
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/app
# ????? ??? ???????? ? ??????? ??????? Flyway
spring.flyway.default-schema=test
spring.flyway.schemas=test