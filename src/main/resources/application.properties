spring.application.name=main-backend

# Подключение к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=test
spring.datasource.username=postgres
spring.datasource.password=postgres

# Запрещает удерживать JPA-сессию до окончания формирования HTTP-ответа
spring.jpa.open-in-view=false

# Hibernate не изменяет структуру базы: таблицы создают Flyway и библиотека
spring.jpa.hibernate.ddl-auto=none
# Схема по умолчанию для JPA-сущностей
spring.jpa.properties.hibernate.default_schema=test

# Миграции приложения. Миграции библиотеки (db/migration/common) service-common
# применяет сам в отдельную историю common_schema_history, сюда их не добавлять
spring.flyway.locations=classpath:db/migration/app
# Схема для миграций и таблицы истории Flyway
spring.flyway.default-schema=test
spring.flyway.schemas=test

# =====================================================================
# Схема `test` должна быть чистой (пересоздайте её или укажите новую):
# библиотека теперь ведёт собственную историю Flyway.
# Пароль datasource должен совпадать с паролем локального PostgreSQL.
# =====================================================================

# Вход по логину и паролю (значение по умолчанию, указано явно).
# Демо-режим без пароля включается профилем demo (application-demo.properties):
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
argent.auth.password-required=true
# Логин администратора, создаваемого при запуске (получает системную роль ADMIN)
argent.auth.bootstrap-admin.login=admin
# Пароль администратора берётся из переменной окружения ARGENT_ADMIN_PASSWORD.
# Если она не задана, а администратора ещё нет, запуск прерывается с ошибкой
# «Задайте argent.auth.bootstrap-admin.password»
argent.auth.bootstrap-admin.password=${ARGENT_ADMIN_PASSWORD:}

# Стартовые роли приложения (READER, EDITOR, MANAGER)
argent.auth.roles-file=classpath:argent-roles.json
# Коды действий приложения для подсказок редактора ролей
argent.security.actions=showcase.publish,import,orders.approve

# Лимиты multipart Spring (по умолчанию 1 МБ) поднимаются до лимита импорта библиотеки
# argent.transfer.max-upload-bytes (20 МБ); запрос чуть больше файла — в нём есть другие части формы
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Папка файлов вложений (/api/attachments) относительно рабочей папки; в git не попадает (data/)
argent.attachments.root=./data/attachments

# Шаблоны JasperReports компилируются при запуске: ошибка в шаблоне останавливает запуск
argent.reports.preload=classpath*:reports/*.jrxml
